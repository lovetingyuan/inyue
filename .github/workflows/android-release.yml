name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-draft-release:
    name: Build Signed APK & Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required Android signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/inyue-release.keystore"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build signed Android Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/inyue-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NUXT_PUBLIC_SENTRY_ANDROID_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_ANDROID_DSN }}
          NUXT_PUBLIC_SENTRY_RELEASE: inyue@${{ github.ref_name }}
        run: |
          chmod +x android/gradlew
          npm run build:android:release

      - name: Extract changelog from annotated tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [ "$(git cat-file -t "refs/tags/$TAG_NAME")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$TAG_NAME" > "$NOTES_FILE"
          else
            printf 'Release %s\n' "$TAG_NAME" > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Release %s\n' "$TAG_NAME" > "$NOTES_FILE"
          fi

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APK_ASSET="$RUNNER_TEMP/inyue-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_ASSET"

          release_args=(
            "$TAG_NAME"
            "$APK_ASSET"
            --draft
            --title "inYue ${TAG_NAME}"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [[ "$TAG_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/inyue-release.keystore"
